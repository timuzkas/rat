<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rat Boxing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #000;
      font-family: "Averia Serif Libre", serif;
      color: #eee;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
    }
    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px;
    }
    .health-bar-container {
      width: 300px;
      height: 4px;
      background: #111;
      position: relative;
    }
    .health-bar {
      height: 100%;
      background: #eee;
      width: 100%;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .health-bar.rat {
      background: #ff4444;
    }
    #rat-health-container {
      align-self: center;
      text-align: center;
    }
    .label {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #555;
    }
    #player-health-container {
      align-self: flex-start;
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    #overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    #ko-text {
      font-size: 120px;
      font-weight: 700;
      letter-spacing: 0.5em;
      margin-bottom: 20px;
    }
    .restart-btn {
      padding: 15px 40px;
      background: transparent;
      border: 2px solid #ff4444;
      color: #ff4444;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }
    .restart-btn:hover {
      background: #ff4444;
      color: #000;
      transform: scale(1.1) rotate(-2deg);
      box-shadow: 0 0 30px rgba(255, 68, 68, 0.5);
    }
    .restart-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: 0.5s;
    }
    .restart-btn:hover::before {
      left: 100%;
    }
    #controls-hint {
      position: fixed;
      bottom: 40px;
      right: 40px;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #333;
      text-align: right;
      line-height: 2;
    }

    #flash-overlay {
       position: fixed;
       inset: 0;
       background: #fff;
       opacity: 0;
       pointer-events: none;
       z-index: 5;
    }
  </style>
</head>
<body>
  <div id="flash-overlay"></div>
  <canvas id="canvas"></canvas>
  
  <div id="ui">
    <div id="rat-health-container">
      <div class="label">Opponent</div>
      <div class="health-bar-container">
        <div id="rat-health" class="health-bar rat"></div>
      </div>
    </div>
    
    <div id="player-health-container">
      <div class="label">You</div>
      <div class="health-bar-container">
        <div id="player-health" class="health-bar"></div>
      </div>
    </div>
  </div>

  <div id="controls-hint">
    Mouse to Dodge<br>
    Shift to Crouch<br>
    LMB / RMB to Punch
  </div>

  <div id="overlay">
    <div id="ko-text">K.O.</div>
    <button class="restart-btn" onclick="location.reload()">AGAIN?</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
      import * as THREE from "three";
      import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
  
      const RAT_MAX_HEALTH = 250;
      const PLAYER_MAX_HEALTH = 100;
      const PUNCH_COOLDOWN = 800;
      const DODGE_STRENGTH = 6;
      const CROUCH_DEPTH = 2;
  
      let ratHealth = RAT_MAX_HEALTH;
      let playerHealth = PLAYER_MAX_HEALTH;
      let gameOver = false;
      
      let dodgeX = 0;
      let targetDodgeX = 0;
      let crouchY = 0;
      let targetCrouchY = 0;
      
      let lastPunchTime = 0;
      let leftPunching = false;
      let rightPunching = false;
  
      let screenShake = 0;
      let particles = [];
      const baseBgColor = new THREE.Color(0x010101);
      
      let isPausing = false; 
      
      const canvas = document.getElementById("canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  
      const scene = new THREE.Scene();
      scene.background = baseBgColor.clone();
  
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 5);
      scene.add(camera);
  
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);
  
      const pointLight = new THREE.PointLight(0xffffff, 100);
      pointLight.position.set(0, 5, 5);
      scene.add(pointLight);
  
      let ratModel = null;
      let ratTex = null;
      const objLoader = new OBJLoader();
      const texLoader = new THREE.TextureLoader();
  
      const fistTexLeft = texLoader.load("fist.png");
      const fistTexRight = texLoader.load("fist.png");
  
      [fistTexLeft, fistTexRight].forEach(tex => {
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        tex.generateMipmaps = false;
      });
  
      fistTexLeft.repeat.set(-1, 1);
      fistTexLeft.offset.set(1, 0);
  
      const handMatLeft = new THREE.SpriteMaterial({
        map: fistTexLeft,
        transparent: true,
        depthTest: false,
      });
  
      const handMatRight = new THREE.SpriteMaterial({
        map: fistTexRight,
        transparent: true,
        depthTest: false,
      });
  
      const leftHand = new THREE.Sprite(handMatLeft);
      const rightHand = new THREE.Sprite(handMatRight);
  
      leftHand.scale.set(1.5, 1.5, 1);
      rightHand.scale.set(1.5, 1.5, 1);
      
      camera.add(leftHand);
      camera.add(rightHand);
      
      leftHand.position.set(-1.8, -0.8, -2.5);
      rightHand.position.set(1.8, -0.8, -2.5);
  
      texLoader.load('rattex.png', (tex) => {
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        ratTex = tex;
        objLoader.load('model_0.obj', (obj) => {
          obj.traverse(child => {
            if (child.isMesh) {
              child.material = new THREE.MeshStandardMaterial({ map: ratTex, metalness: 0.1, roughness: 0.8 });
              child.geometry.computeBoundingBox();
              child.geometry.center();
              const box = new THREE.Box3().setFromObject(child);
              const size = box.getSize(new THREE.Vector3());
              const maxDim = Math.max(size.x, size.y, size.z) || 1;
              child.scale.set(1/maxDim, 1/maxDim, 1/maxDim);
            }
          });
          ratModel = obj;
          ratModel.scale.set(4, 4, 4);
          ratModel.rotation.y = Math.PI;
          ratModel.position.y = 2;
          scene.add(ratModel);
        });
      });
  
      function createExplosion(pos) {
        const count = 60;
        const geom = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const mat = new THREE.MeshStandardMaterial({ color: 0xff4444, emissive: 0xff0000 });
        for (let i = 0; i < count; i++) {
          const p = new THREE.Mesh(geom, mat);
          p.position.copy(pos);
          p.velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 15,
            (Math.random() - 0.5) * 15,
            (Math.random() - 0.5) * 15
          );
          p.life = 1.0;
          scene.add(p);
          particles.push(p);
        }
      }
  
      window.addEventListener('mousemove', (e) => {
        if (gameOver) return;
        targetDodgeX = ((e.clientX / window.innerWidth) * 2 - 1) * DODGE_STRENGTH;
      });
  
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Shift') targetCrouchY = CROUCH_DEPTH;
      });
  
      window.addEventListener('keyup', (e) => {
        if (e.key === 'Shift') targetCrouchY = 0;
      });
  
      window.addEventListener('mousedown', (e) => {
        if (gameOver) return;
        const now = Date.now();
        if (now - lastPunchTime < PUNCH_COOLDOWN) return;
        
        if (e.button === 0) {
          leftPunching = true;
          lastPunchTime = now;
          checkHit('left');
        } else if (e.button === 2) {
          rightPunching = true;
          lastPunchTime = now;
          checkHit('right');
        }
      });
  
      window.addEventListener('contextmenu', e => e.preventDefault());
  
      function checkHit(hand) {
        if (!ratModel || ratState === "KO" || gameOver) return;
  
        const handX = hand === "left" ? camera.position.x - 1.2 : camera.position.x + 1.2;
        const dist = Math.abs(handX - ratModel.position.x);
  
        if (dist < 1.8) {
          let damage = 10;
          if (ratState === "WINDUP" || ratState === "RECOVER") damage = 18;
  
          ratHealth -= damage;
updateUI();

          isPausing = true;
setTimeout(() => (isPausing = false), 50);

          ratState = "HIT";
          ratTimer = 0.25;
          ratModel.position.z -= 1.5;
          ratModel.rotation.z += hand === "left" ? 0.4 : -0.4;
          ratModel.rotation.x -= 0.3;
  
          flash(0xffffff, 0.4, 4);
  
          if (ratHealth <= 0) {
            triggerKO("rat");
          }
        }
      }
  
      function flash(color, intensity, shake = 0) {
        scene.background.set(color);
        screenShake = Math.max(screenShake, shake);
        setTimeout(() => {
          scene.background.copy(baseBgColor);
        }, 70);
      }
  
      function triggerKO(who) {
        gameOver = true;
        document.getElementById('overlay').classList.add('active');
        if (who === 'rat') {
          document.getElementById('ko-text').innerText = 'RAT K.O.';
          document.getElementById('ko-text').style.color = '#ff4444';
          document.getElementById('ko-text').style.textShadow = '0 0 50px #ff0000';
          ratState = 'KO';
          createExplosion(ratModel.position);
          ratModel.visible = false;
          flash(0xff4444, 0.5, 5);
        } else {
          document.getElementById('ko-text').innerText = 'YOU K.O.';
          document.getElementById('ko-text').style.color = '#eee';
          camera.rotation.z = 0.5;
          flash(0xff0000, 0.5, 10);
        }
      }
  
      function updateUI() {
        const ratHealthPercent = (Math.max(0, ratHealth) / RAT_MAX_HEALTH) * 100;
        document.getElementById('rat-health').style.width = ratHealthPercent + '%';
        document.getElementById('player-health').style.width = Math.max(0, playerHealth) + '%';
      }
  
      let ratState = 'IDLE';
      let ratTimer = 0;
      let currentAttack = null;
      let attackProcessed = false;
  
      function updateAI(dt) {
        if (gameOver || !ratModel || isPausing) return;
      
        ratTimer -= dt;
      
        if (ratState === "IDLE" && ratTimer <= 0) {
          ratState = "WINDUP";
          ratTimer = 0.5 + Math.random() * 0.4;
          currentAttack = Math.random() > 0.5 ? "LEFT" : "RIGHT";
          attackProcessed = false;
        } else if (ratState === "WINDUP" && ratTimer <= 0) {
          ratState = "ATTACK";
          ratTimer = 0.15;
        } else if (ratState === "ATTACK") {
          if (ratTimer < 0.04 && !attackProcessed) {
            attackProcessed = true;
            let dodged = false;
            if (Math.abs(dodgeX) > 1.2) dodged = true;
            if (targetCrouchY > 1.5) dodged = true;
      
            if (!dodged) {
              playerHealth -= 25;
              updateUI();
              flash(0xff0000, 0.6, 15);
              if (playerHealth <= 0) triggerKO("player");
            }
          }
          if (ratTimer <= 0) {
            ratState = "RECOVER";
            ratTimer = 0.6;
          }
        } else if (ratState === "HIT" && ratTimer <= 0) {
          ratState = "RECOVER";
          ratTimer = 0.4;
        } else if (ratState === "RECOVER" && ratTimer <= 0) {
          ratState = "IDLE";
          ratTimer = 0.4 + Math.random() * 0.6;
}

        const time = Date.now() * 0.001;
        if (ratState === "IDLE") {
          const shuffleX = Math.sin(time * 4) * 2;
          const jumpY = Math.abs(Math.sin(time * 8)) * 0.4;
          ratModel.position.x = THREE.MathUtils.lerp(ratModel.position.x, shuffleX, 0.1);
          ratModel.position.y = THREE.MathUtils.lerp(ratModel.position.y, 2 + jumpY, 0.1);
          ratModel.rotation.y = Math.PI + Math.sin(time * 10) * 0.1;
          ratModel.position.z = THREE.MathUtils.lerp(ratModel.position.z, 0, 0.1);
        }
      
        if (ratState === "WINDUP") {
          const targetX = currentAttack === "LEFT" ? 3.5 : -3.5;
          ratModel.position.x = THREE.MathUtils.lerp(ratModel.position.x, targetX, 0.15);
          ratModel.position.y = THREE.MathUtils.lerp(ratModel.position.y, 2.8, 0.15);
        } else if (ratState === "ATTACK") {
          ratModel.position.z = THREE.MathUtils.lerp(ratModel.position.z, 5, 0.3);
          ratModel.position.x = THREE.MathUtils.lerp(ratModel.position.x, 0, 0.3);
        } else if (ratState === "HIT") {
          ratModel.position.z = THREE.MathUtils.lerp(ratModel.position.z, -2, 0.2);
        } else if (ratState === "RECOVER") {
          ratModel.position.z = THREE.MathUtils.lerp(ratModel.position.z, 0, 0.1);
          ratModel.rotation.x = THREE.MathUtils.lerp(ratModel.rotation.x, 0, 0.1);
          ratModel.rotation.z = THREE.MathUtils.lerp(ratModel.rotation.z, 0, 0.1);
        }
      }
  
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        if (isPausing) return;
      
        const dt = clock.getDelta();
      
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.position.addScaledVector(p.velocity, dt);
          p.velocity.y -= 35 * dt;
          p.life -= dt;
          p.scale.setScalar(p.life);
          if (p.life <= 0) {
            scene.remove(p);
            particles.splice(i, 1);
          }
}
       
        dodgeX += (targetDodgeX - dodgeX) * 0.15;
crouchY += (targetCrouchY - crouchY) * 0.15;
      
        const orbitAngle = dodgeX * 0.3;
        camera.position.x = Math.sin(orbitAngle) * 5;
        camera.position.z = Math.cos(orbitAngle) * 5;
        camera.position.y = 2.2 - crouchY;
      
        if (screenShake > 0) {
          camera.position.x += (Math.random() - 0.5) * screenShake * 0.15;
          camera.position.y += (Math.random() - 0.5) * screenShake * 0.15;
          screenShake *= 0.85;
        }
      
        camera.lookAt(0, 2, 0);
      
        const punchSpeed = 18;
        if (leftPunching) {
          leftHand.position.z -= punchSpeed * dt;
          if (leftHand.position.z < -5) leftPunching = false;
        } else {
          leftHand.position.z += (-2.5 - leftHand.position.z) * 0.25;
        }
      
        if (rightPunching) {
          rightHand.position.z -= punchSpeed * dt;
          if (rightHand.position.z < -5) rightPunching = false;
        } else {
          rightHand.position.z += (-2.5 - rightHand.position.z) * 0.25;
        }
      
        updateAI(dt);
        renderer.render(scene, camera);
      }
  
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
  
      animate();
    </script>
</body>
</html>
