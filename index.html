<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rat Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --text: #e0e0e0;
      --accent: #555;
      --font-main: "Averia Serif Libre", serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    #header {
      padding: 100px 0 60px 0;
      text-align: center;
      opacity: 0;
      user-select: none;
      position: relative;
    }
    .rat-title {
      font-size: 160px;
      font-weight: 700;
      letter-spacing: 0.2em;
      display: flex;
      justify-content: center;
      gap: 40px;
      perspective: 1000px;
      cursor: pointer;
      position: relative;
      z-index: 5;
    }
    .rat-letter {
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.1, 0.8, 0.2, 1);
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
    }

    #gol-canvas {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      max-width: 800px;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    #gol-canvas.active {
      opacity: 0.75;
      pointer-events: auto;
    }

    #catalog {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 40px;
      padding: 0 60px 100px 60px;
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
    }

    .item {
      position: relative;
      width: 400px;
      aspect-ratio: 16 / 10;
      background: #0a0a0a;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.6s ease;
      border: 1px solid #111;
      transform: translateY(40px);
      opacity: 0;
    }

    .item:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      border-color: #222;
      z-index: 10;
    }

    .item-canvas-container {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .item-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .item:hover .item-info {
      opacity: 1;
    }

    .item-title {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #888;
    }

    #expanded-container {
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      background: var(--bg);
    }

    #expanded-container.active {
      pointer-events: auto;
      opacity: 1;
    }

    #expanded-content {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    .back-btn {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 1100;
      font-size: 32px;
      cursor: pointer;
      color: var(--accent);
      user-select: none;
      transition: color 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .back-btn:hover {
      color: var(--text);
      transform: scale(1.1) rotate(-8deg);
    }

    .zoom-overlay {
      position: fixed;
      z-index: 2000;
      background: var(--bg);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    body.zoomed #header,
    body.zoomed #catalog {
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #111; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #222; }

    #footer {
      position: relative;
      width: 100%;
      text-align: center;
      padding: 40px 0;
      font-size: 14px;
      letter-spacing: 0.1em;
      color: #444;
      background: #050505;
      opacity: 0;
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #footer a {
      color: #666;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    #footer a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <header id="header">
    <canvas id="gol-canvas"></canvas>
    <div class="rat-title" id="rat-title">
      <span class="rat-letter">r</span>
      <span class="rat-letter">a</span>
      <span class="rat-letter">t</span>
    </div>
  </header>

  <div id="catalog"></div>

  <footer id="footer">
    made by <a href="https://timuzkas.xyz" target="_blank">timuzkas.xyz</a>
  </footer>

  <div id="expanded-container">
    <div id="expanded-content">
      <div class="back-btn" id="back-btn">rat?</div>
      <iframe id="game-frame" src=""></iframe>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

    const letters = document.querySelectorAll('.rat-letter');
    const header = document.getElementById('header');
    const ratTitle = document.getElementById('rat-title');
    const golCanvas = document.getElementById('gol-canvas');

    window.addEventListener('mousemove', (e) => {
      if (golActive) return;
      letters.forEach(letter => {
        const rect = letter.getBoundingClientRect();
        const letterCenterX = rect.left + rect.width / 2;
        const letterCenterY = rect.top + rect.height / 2;
        const dx = e.clientX - letterCenterX;
        const dy = e.clientY - letterCenterY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 200;
        if (dist < maxDist) {
          const power = (1 - dist / maxDist) * 60;
          const angle = Math.atan2(dy, dx);
          const moveX = -Math.cos(angle) * power;
          const moveY = -Math.sin(angle) * power;
          letter.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${moveX * 0.2}deg)`;
        } else {
          letter.style.transform = `translate(0, 0) rotate(0)`;
        }
      });
    });

    let clickCount = 0;
    let clickResetTimeout = null;
    let golActive = false;

    const ctx = golCanvas.getContext('2d');
    const resolution = 10;
    let cols;
    let rows;
    let grid;
    let golInterval = null;

    ratTitle.addEventListener('click', () => {
      if (golActive) return;

      clickCount++;
      clearTimeout(clickResetTimeout);

letters.forEach(letter => {
        letter.style.transition = 'none';
        letter.style.transform = `translate(${(Math.random() - 0.5) * 30}px, ${(Math.random() - 0.5) * 30}px) scale(1.1)`;
        setTimeout(() => {
          letter.style.transition = 'transform 0.2s cubic-bezier(0.1, 0.8, 0.2, 1)';
          if (!golActive) letter.style.transform = 'translate(0,0) scale(1)';
        }, 100);
      });

      clickResetTimeout = setTimeout(() => {
        clickCount = 0;
      }, 1000);

      if (clickCount >= 5) {
        triggerGameOfLifeMorph();
      }
    });

    function triggerGameOfLifeMorph() {
      golActive = true;
      
      letters.forEach((letter, i) => {
        letter.style.transition = 'all 1.5s cubic-bezier(0.16, 1, 0.3, 1)';
        letter.style.opacity = '0';
        letter.style.transform = `scale(0.1) rotate(${720 + (i * 180)}deg) translateY(100px)`;
      });

      setTimeout(() => {
        ratTitle.style.display = 'none';
      }, 1500);

      resizeGolCanvas();
      initGolGrid();
      
      golCanvas.classList.add('active');
      golInterval = setInterval(stepGoL, 100);

      window.addEventListener('resize', resizeGolCanvas);
    }

    function resizeGolCanvas() {
      const rect = header.getBoundingClientRect();
      golCanvas.width = rect.width;
      golCanvas.height = rect.height;
      cols = Math.floor(golCanvas.width / resolution);
      rows = Math.floor(golCanvas.height / resolution);
    }

    function initGolGrid() {
      grid = buildGrid();
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          grid[c][r] = Math.random() > 0.85 ? 1 : 0;
        }
      }

      const midC = Math.floor(cols / 2);
      const midR = Math.floor(rows / 2);
      if (midC > 5 && midR > 5) {
        grid[midC][midR - 1] = 1;
        grid[midC + 1][midR] = 1;
        grid[midC - 1][midR + 1] = 1;
        grid[midC][midR + 1] = 1;
        grid[midC + 1][midR + 1] = 1;
      }
    }

    function buildGrid() {
      return Array(cols).fill(null).map(() => Array(rows).fill(0));
    }

    function stepGoL() {
      drawGoL();
      
      const next = buildGrid();
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          const state = grid[c][r];
          
          let sum = 0;
          for (let i = -1; i < 2; i++) {
            for (let j = -1; j < 2; j++) {
              if (i === 0 && j === 0) continue;
              const x = (c + i + cols) % cols;
              const y = (r + j + rows) % rows;
              sum += grid[x][y];
            }
          }

          if (state === 1 && (sum < 2 || sum > 3)) {
            next[c][r] = 0;
          } else if (state === 0 && sum === 3) {
            next[c][r] = 1;
          } else {
            next[c][r] = state;
          }
        }
      }
      grid = next;
    }

    function drawGoL() {
      ctx.clearRect(0, 0, golCanvas.width, golCanvas.height);
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          if (grid[c][r] === 1) {
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(c * resolution, r * resolution, resolution - 1, resolution - 1);
          }
        }
      }
    }

    golCanvas.addEventListener('mousedown', (e) => {
      if (!golActive) return;
      const rect = golCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      const c = Math.floor(clickX / resolution);
      const r = Math.floor(clickY / resolution);
      if (c >= 0 && c < cols && r >= 0 && r < rows) {
        grid[c][r] = 1;
        if (c > 0) grid[c-1][r] = 1;
        if (c < cols-1) grid[c+1][r] = 1;
        if (r > 0) grid[c][r-1] = 1;
        if (r < rows-1) grid[c][r+1] = 1;
        drawGoL();
      }
    });


    class RatVisualizer {
      constructor(container, type = 'pong') {
        this.container = container;
        this.type = type;
        this.active = true;
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        this.camera.position.z = 8;
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(container.clientWidth, container.clientHeight);
        this.renderer.setPixelRatio(1);
        container.appendChild(this.renderer.domElement);
        this.clock = new THREE.Clock();
        this.time = 0;
        this.init();
        this.animate();
      }

      init() {
        this.scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        if (this.type === 'pong') this.setupPong();
        else if (this.type === 'orbit') this.setupOrbit();
        else if (this.type === 'king') this.setupKing();
        else if (this.type === 'raycast') this.setupRaycast();
        else if (this.type === 'boxing') this.setupBoxing();
      }

      loadNormalizedRat(callback) {
        new OBJLoader().load('model_0.obj', (obj) => {
          obj.traverse(child => {
            if (child.isMesh) {
              child.material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
              child.geometry.computeBoundingBox();
              child.geometry.center();
              const box = new THREE.Box3().setFromObject(child);
              const size = box.getSize(new THREE.Vector3());
              const maxDim = Math.max(size.x, size.y, size.z) || 1;
              child.scale.set(1/maxDim, 1/maxDim, 1/maxDim);
            }
          });
          callback(obj);
        });
      }

      setupPong() {
        this.loadNormalizedRat((rat) => {
          this.rat = rat;
          this.rat.scale.set(3,3,3);
          this.scene.add(this.rat);
        });
        this.paddles = [];
        const geom = new THREE.BoxGeometry(0.5, 2, 0.5);
        const mat = new THREE.MeshBasicMaterial({ color: 0x888888, wireframe: true });
        const p1 = new THREE.Mesh(geom, mat);
        p1.position.set(-6, 0, 0);
        const p2 = p1.clone();
        p2.position.set(6, 0, 0);
        this.scene.add(p1, p2);
        this.paddles.push(p1, p2);
      }

      setupOrbit() {
        this.loadNormalizedRat((rat) => {
          this.rat = rat;
          this.rat.scale.set(2.5,2.5,2.5);
          this.scene.add(this.rat);
        });
        this.sats = [];
        const geom = new THREE.SphereGeometry(0.2, 8, 8);
        const mat = new THREE.MeshBasicMaterial({ color: 0x888888, wireframe: true });
        for(let i=0; i<3; i++) {
          const s = new THREE.Mesh(geom, mat);
          this.scene.add(s);
          this.sats.push(s);
        }
      }

      setupKing() {
        this.loadNormalizedRat((rat) => {
          this.rat = rat;
          this.rat.scale.set(3,3,3);
          this.scene.add(this.rat);
          const crownGeom = new THREE.ConeGeometry(0.6, 0.8, 5);
          const crownMat = new THREE.MeshBasicMaterial({ color: 0x888888, wireframe: true });
          const crown = new THREE.Mesh(crownGeom, crownMat);
          crown.position.y = 1.6;
          crown.rotation.x = Math.PI;
          this.rat.add(crown);
        });
      }

      setupRaycast() {
        this.loadNormalizedRat((rat) => {
          this.rat = rat;
          this.rat.scale.set(3,3,3);
          this.scene.add(this.rat);
        });
        this.lines = [];
        const mat = new THREE.LineBasicMaterial({ color: 0x444444 });
        for(let i=0; i<5; i++) {
          const points = [new THREE.Vector3(-8, (i-2)*1.5, 0), new THREE.Vector3(8, (i-2)*1.5, 0)];
          const geom = new THREE.BufferGeometry().setFromPoints(points);
          const line = new THREE.Line(geom, mat);
          this.scene.add(line);
          this.lines.push(line);
        }
      }

      setupBoxing() {
        this.loadNormalizedRat((rat) => {
          this.rat = rat;
          this.rat.scale.set(3,3,3);
          this.scene.add(this.rat);
        });
        const geom = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const mat = new THREE.MeshBasicMaterial({ color: 0x888888, wireframe: true });
        this.glove = new THREE.Mesh(geom, mat);
        this.glove.position.set(0, 0, 3);
        this.scene.add(this.glove);
      }

      animate() {
        if (!this.active) return;
        requestAnimationFrame(() => this.animate());

        const dt = this.clock.getDelta();
        this.time += dt;

        if (this.rat) {
          this.rat.rotation.y = this.time * 0.5;
        }

        if (this.type === 'pong' && this.rat) {
          this.rat.position.x = Math.sin(this.time * 2) * 4;
          this.rat.position.y = Math.abs(Math.cos(this.time * 2)) * 2 - 1;
          this.paddles[0].position.y = THREE.MathUtils.lerp(this.paddles[0].position.y, this.rat.position.y, 0.1);
          this.paddles[1].position.y = THREE.MathUtils.lerp(this.paddles[1].position.y, this.rat.position.y, 0.1);
        }

        if (this.type === 'orbit') {
          this.sats.forEach((s, i) => {
            const angle = this.time * 1.5 + (i * Math.PI * 2 / 3);
            s.position.set(Math.cos(angle) * 3, Math.sin(this.time + i) * 1, Math.sin(angle) * 3);
          });
        }

        if (this.type === 'king' && this.rat) {
          this.rat.position.y = Math.sin(this.time * 2) * 0.3;
          this.rat.rotation.z = Math.sin(this.time * 3) * 0.1;
        }

        if (this.type === 'raycast' && this.rat) {
          this.rat.position.x = Math.sin(this.time) * 3;
          this.rat.position.y = Math.cos(this.time * 1.5) * 2;
        }

        if (this.type === 'boxing' && this.rat) {
          this.glove.position.z = 2 + Math.abs(Math.sin(this.time * 4)) * 3;
          this.rat.position.z = -Math.max(0, (this.glove.position.z - 3.5)) * 0.5;
        }

        this.renderer.render(this.scene, this.camera);
      }

      destroy() {
        this.active = false;
        this.renderer.dispose();
        if (this.container.contains(this.renderer.domElement)) {
          this.container.removeChild(this.renderer.domElement);
        }
      }
    }

    const catalogData = [
      { id: 1, title: 'rat boxing', type: 'boxing', url: 'rat-boxing.html' },
      { id: 2, title: 'rat pong', type: 'pong', url: '#' },
      { id: 3, title: 'orbit rat', type: 'orbit', url: '#' },
      { id: 4, title: 'king rat', type: 'king', url: '#' },
      { id: 5, title: 'raycast rat', type: 'raycast', url: '#' },
    ];

    const catalogEl = document.getElementById('catalog');
    const expandedContainer = document.getElementById('expanded-container');
    const gameFrame = document.getElementById('game-frame');
    const backBtn = document.getElementById('back-btn');
    const footer = document.getElementById('footer');
    const activeVisualizers = [];

    function runIntro() {
      const header = document.getElementById('header');
      header.style.transition = 'opacity 1.5s ease';
      header.style.opacity = '1';

      setTimeout(() => {
        catalogEl.style.opacity = '1';
        const items = document.querySelectorAll('.item');
        items.forEach((item, index) => {
          setTimeout(() => {
            item.style.transition = 'all 1s cubic-bezier(0.16, 1, 0.3, 1)';
            item.style.transform = 'translateY(0)';
            item.style.opacity = '1';
          }, index * 150);
        });
      }, 500);

      setTimeout(() => {
        footer.style.opacity = '1';
      }, 1500);
    }

    if (catalogEl) {
      catalogData.forEach(data => {
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `
          <div class="item-canvas-container"></div>
          <div class="item-info">
            <div class="item-title">${data.title}</div>
          </div>
        `;
        catalogEl.appendChild(item);
        const container = item.querySelector('.item-canvas-container');
        activeVisualizers.push(new RatVisualizer(container, data.type));
        item.addEventListener('click', () => expandItem(data, item));
      });
      runIntro();
    }

    function expandItem(data, itemEl) {
      if (data.url === '#') return;
      const rect = itemEl.getBoundingClientRect();
      const overlay = document.createElement('div');
      overlay.className = 'zoom-overlay';
      Object.assign(overlay.style, { top: rect.top + 'px', left: rect.left + 'px', width: rect.width + 'px', height: rect.height + 'px', borderRadius: '4px', opacity: '1' });
      document.body.appendChild(overlay);

      requestAnimationFrame(() => {
        overlay.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
        Object.assign(overlay.style, { top: '0', left: '0', width: '100vw', height: '100vh', borderRadius: '0' });
      });

      setTimeout(() => {
        document.body.classList.add('zoomed');
        expandedContainer.classList.add('active');
        gameFrame.src = data.url;
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 600);
      }, 600);
    }

    backBtn.addEventListener('click', () => {
      document.body.classList.remove('zoomed');
      expandedContainer.classList.remove('active');
      setTimeout(() => {
        gameFrame.src = '';
      }, 600);
    });
  </script>
</body>
</html>
