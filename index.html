<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="rat.ico" type="image/x-icon">
  <title>rat?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --text: #e0e0e0;
      --accent: #555;
      --font-main: "Averia Serif Libre", serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    #header {
      padding: 100px 0 60px 0;
      text-align: center;
      opacity: 0;
      user-select: none;
      position: relative;
    }
    .rat-title {
      font-size: 160px;
      font-weight: 700;
      letter-spacing: 0.2em;
      display: flex;
      justify-content: center;
      gap: 40px;
      perspective: 1000px;
    }
    .rat-letter {
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.1, 0.8, 0.2, 1);
      cursor: default;
      position: relative;
      transform-style: preserve-3d;
    }

    #gol-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    rat-title .rat-letter {
       transition: opacity 0.4s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #gol-canvas.visible {
      opacity: 1;
    }

    .rat-title.gol-active .rat-letter {
      opacity: 0 !important;
      transform: scale(0.5) rotateX(90deg) !important;
      pointer-events: none;
    }

    #catalog {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 40px;
      padding: 0 60px 100px 60px;
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
	  opacity: 0;
    }

    .item {
      position: relative;
      width: 400px;
      aspect-ratio: 16 / 10;
      background: #0a0a0a;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.6s ease;
      border: 1px solid #111;
      transform: translateY(40px);
      opacity: 0;
    }

    .item:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      border-color: #222;
      z-index: 10;
    }

    .item-canvas-container {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .item-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .item:hover .item-info {
      opacity: 1;
    }

    .item-title {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #888;
    }

    #expanded-container {
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      background: var(--bg);
    }

    #expanded-container.active {
      pointer-events: auto;
      opacity: 1;
    }

    #expanded-content {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    .back-btn {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 1100;
      font-size: 32px;
      cursor: pointer;
      color: var(--accent);
      user-select: none;
      transition: color 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .back-btn:hover {
      color: var(--text);
      transform: scale(1.1) rotate(-8deg);
    }

    .zoom-overlay {
      position: fixed;
      z-index: 2000;
      background: var(--bg);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    body.zoomed #header,
    body.zoomed #catalog {
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #111; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #222; }


    #footer {
          position: relative;
          width: 100%;
          text-align: center;
          padding: 40px 0;
          font-size: 14px;
          letter-spacing: 0.1em;
          color: #444;
          background: #050505;
          opacity: 0;
          transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
    
        #footer a {
          color: #666;
          text-decoration: none;
          transition: color 0.3s ease;
        }
    
        #footer a:hover {
          color: var(--text);
        }
  </style>
</head>
<body>

  <header id="header">
    <div class="rat-title" id="rat-title">
      <span class="rat-letter">r</span>
      <span class="rat-letter">a</span>
      <span class="rat-letter">t</span>
    </div>
    <canvas id="gol-canvas"></canvas>
  </header>

  <div id="catalog"></div>

  <footer id="footer">
    made by <a href="https://timuzkas.xyz" target="_blank">timuzkas.xyz</a>
  </footer>

  <div id="expanded-container">
    <div id="expanded-content">
      <div class="back-btn" id="back-btn">rat?</div>
      <iframe id="game-frame" src=""></iframe>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

    const letters = document.querySelectorAll('.rat-letter');

    window.addEventListener('mousemove', (e) => {
      if (golActive) return;
      letters.forEach(letter => {
        const rect = letter.getBoundingClientRect();
        const letterCenterX = rect.left + rect.width / 2;
        const letterCenterY = rect.top + rect.height / 2;
        const dx = e.clientX - letterCenterX;
        const dy = e.clientY - letterCenterY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 200;
        if (dist < maxDist) {
          const power = (1 - dist / maxDist) * 60;
          const angle = Math.atan2(dy, dx);
          const moveX = -Math.cos(angle) * power;
          const moveY = -Math.sin(angle) * power;
          letter.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${moveX * 0.2}deg)`;
        } else {
          letter.style.transform = `translate(0, 0) rotate(0)`;
        }
      });
    });

    const CELL = 6;
    const GOL_INTERVAL = 80; // ms per generation
    const CLICK_THRESHOLD = 5;
    const CLICK_WINDOW = 2000; // ms

    let golActive = false;
    let golGrid = null;
    let golCols = 0;
    let golRows = 0;
    let golIntervalId = null;

    const ratTitle = document.getElementById('rat-title');
    const golCanvas = document.getElementById('gol-canvas');
    const golCtx = golCanvas.getContext('2d');

    let clickTimes = [];

    ratTitle.addEventListener('click', () => {
      if (golActive) {
        stopGol();
        return;
      }
      const now = Date.now();
      clickTimes.push(now);
      clickTimes = clickTimes.filter(t => now - t < CLICK_WINDOW);
      if (clickTimes.length >= CLICK_THRESHOLD) {
        clickTimes = [];
        startGol();
      }
    });

    function seedFromLetters() {
      const header = document.getElementById('header');
      const w = header.clientWidth;
      const h = header.clientHeight;

      const offscreen = document.createElement('canvas');
      offscreen.width = w;
      offscreen.height = h;
      const ctx = offscreen.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.font = `700 160px "Averia Serif Libre", serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const letterSpacing = 40;
      const chars = ['r', 'a', 't'];
      const charWidths = chars.map(c => ctx.measureText(c).width);
      const totalWidth = charWidths.reduce((a, b) => a + b, 0) + letterSpacing * (chars.length - 1);
      let x = w / 2 - totalWidth / 2;
      const y = h / 2;

      chars.forEach((ch, i) => {
        ctx.fillText(ch, x + charWidths[i] / 2, y);
        x += charWidths[i] + letterSpacing;
      });

      const cols = Math.floor(w / CELL);
      const rows = Math.floor(h / CELL);
      const grid = new Uint8Array(cols * rows);
      const imageData = ctx.getImageData(0, 0, w, h);

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const px = Math.floor(col * CELL + CELL / 2);
          const py = Math.floor(row * CELL + CELL / 2);
          const idx = (py * w + px) * 4;
          const alpha = imageData.data[idx + 3];
          const brightness = imageData.data[idx];
          grid[row * cols + col] = (alpha > 128 && brightness > 128) ? 1 : 0;
        }
      }

      return { grid, cols, rows };
    }

    function startGol() {
      golActive = true;
      const header = document.getElementById('header');

      golCanvas.width = header.clientWidth;
      golCanvas.height = header.clientHeight;

      const seed = seedFromLetters();
      golGrid = seed.grid;
      golCols = seed.cols;
      golRows = seed.rows;

      ratTitle.classList.add('gol-active');
      golCanvas.classList.add('visible');

      drawGol();
      golIntervalId = setInterval(stepGol, GOL_INTERVAL);
    }

    function stopGol() {
      golActive = false;
      clearInterval(golIntervalId);
      golIntervalId = null;

      golCanvas.classList.remove('visible');
      ratTitle.classList.remove('gol-active');

      letters.forEach((l, i) => {
          l.style.opacity = '0';
          l.style.transform = 'scale(0.5) translateY(20px)';
          setTimeout(() => {
            l.style.opacity = '1';
            l.style.transform = 'scale(1) translateY(0)';
          }, i * 50);
      });
    }

    function stepGol() {
      const next = new Uint8Array(golCols * golRows);
      for (let row = 0; row < golRows; row++) {
        for (let col = 0; col < golCols; col++) {
          const alive = golGrid[row * golCols + col];
          let neighbors = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const r = row + dr;
              const c = col + dc;
              if (r >= 0 && r < golRows && c >= 0 && c < golCols) {
                neighbors += golGrid[r * golCols + c];
              }
            }
          }
          if (alive) {
            next[row * golCols + col] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
          } else {
            next[row * golCols + col] = neighbors === 3 ? 1 : 0;
          }
        }
      }
      golGrid = next;
      drawGol();
    }

    function drawGol() {
      golCtx.clearRect(0, 0, golCanvas.width, golCanvas.height);
      golCtx.fillStyle = '#e0e0e0';
      for (let row = 0; row < golRows; row++) {
        for (let col = 0; col < golCols; col++) {
          if (golGrid[row * golCols + col]) {
            golCtx.fillRect(col * CELL + 1, row * CELL + 1, CELL - 1, CELL - 1);
          }
        }
      }
    }

    class RatVisualizer {
      constructor(container, type = 'pong') {
        this.container = container;
        this.type = type;
        this.active = true;
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        this.camera.position.z = 8;
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(container.clientWidth, container.clientHeight);
        this.renderer.setPixelRatio(1);
        container.appendChild(this.renderer.domElement);
        this.clock = new THREE.Clock();
        this.time = 0;
        this.init();
        this.animate();
      }

      init() {
        this.scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        if (this.type === 'pong') this.setupPong();
        else if (this.type === 'orbit') this.setupOrbit();
        else if (this.type === 'king') this.setupKing();
        else if (this.type === 'raycast') this.setupRaycast();
        else if (this.type === 'boxing') this.setupBoxing();
      }

      loadNormalizedRat(callback) {
        new OBJLoader().load('model_0.obj', (obj) => {
          obj.traverse(child => {
            if (child.isMesh) {
              child.material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
              child.geometry.computeBoundingBox();
              child.geometry.center();
              const box = new THREE.Box3().setFromObject(child);
              const size = box.getSize(new THREE.Vector3());
              const maxDim = Math.max(size.x, size.y, size.z) || 1;
              const scale = 1.0 / maxDim;
              child.scale.set(scale, scale, scale);
            }
          });
          callback(obj);
        });
      }

      setupPong() {
        const paddleGeom = new THREE.BoxGeometry(0.2, 2.4, 0.2);
        const paddleMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
        this.leftPaddle = new THREE.Mesh(paddleGeom, paddleMat);
        this.rightPaddle = new THREE.Mesh(paddleGeom, paddleMat);
        this.leftPaddle.position.x = -6;
        this.rightPaddle.position.x = 6;
        this.scene.add(this.leftPaddle, this.rightPaddle);

        this.ball = new THREE.Group();
        this.scene.add(this.ball);
        this.loadNormalizedRat((obj) => {
          obj.scale.set(0.6, 0.6, 0.6);
          this.ball.add(obj);
        });
        this.ballVel = new THREE.Vector3(5, 3, 0);
      }

      setupOrbit() {
        this.orbits = new THREE.Group();
        this.scene.add(this.orbits);
        const count = 5;
        for(let i = 0; i < count; i++) {
          const orbitGroup = new THREE.Group();
          orbitGroup.rotation.x = Math.random() * Math.PI;
          orbitGroup.rotation.y = Math.random() * Math.PI;
          const rat = new THREE.Group();
          this.loadNormalizedRat((obj) => {
            obj.scale.set(0.5, 0.5, 0.5);
            rat.add(obj);
          });
          rat.position.x = 5;
          rat.userData.offset = Math.random() * Math.PI * 2;
          rat.userData.speed = 0.5 + Math.random() * 1.5;
          orbitGroup.add(rat);
          this.orbits.add(orbitGroup);
        }
      }

      setupKing() {
        this.kingChain = [];
        const count = 8;
        for(let i = 0; i < count; i++) {
          const rat = new THREE.Group();
          this.loadNormalizedRat((obj) => {
            obj.scale.set(0.7, 0.7, 0.7);
            rat.add(obj);
          });
          this.scene.add(rat);
          this.kingChain.push(rat);
        }
      }

      setupRaycast() {
        const wallGeom = new THREE.BoxGeometry(1, 2, 1);
        const wallMat = new THREE.MeshBasicMaterial({ color: 0x111111, wireframe: true });
        for(let i = 0; i < 20; i++) {
          const wall = new THREE.Mesh(wallGeom, wallMat);
          wall.position.set((Math.random()-0.5)*15, 0, (Math.random()-0.5)*15);
          this.scene.add(wall);
        }
        
        this.stalker = new THREE.Group();
        this.loadNormalizedRat((obj) => {
          obj.scale.set(1.5, 1.5, 1.5);
          obj.traverse(c => { if(c.isMesh) c.material.color.set(0xff0000); });
          this.stalker.add(obj);
        });
        this.scene.add(this.stalker);
        this.camera.position.set(0, 0.5, 5);
        this.camera.lookAt(0, 0, 0);
      }

      setupBoxing() {
        this.opponent = new THREE.Group();
        this.loadNormalizedRat((obj) => {
          obj.scale.set(3, 3, 3);
          this.opponent.add(obj);
        });
        this.scene.add(this.opponent);

        const handGeom = new THREE.BoxGeometry(0.5, 0.5, 0.8);
        const handMat = new THREE.MeshBasicMaterial({ color: 0x333333, wireframe: true });
        this.leftHand = new THREE.Mesh(handGeom, handMat);
        this.rightHand = new THREE.Mesh(handGeom, handMat);
        this.leftHand.position.set(-1.5, -1, 4);
        this.rightHand.position.set(1.5, -1, 4);
        this.scene.add(this.leftHand, this.rightHand);
        
        this.camera.position.set(0, 0, 8);
      }

      update(dt) {
        this.time += dt;
        if (this.type === 'pong') {
          this.ball.position.x += this.ballVel.x * dt;
          this.ball.position.y += this.ballVel.y * dt;
          if (Math.abs(this.ball.position.x) > 6) { this.ballVel.x *= -1; this.ball.position.x = Math.sign(this.ball.position.x) * 6; }
          if (Math.abs(this.ball.position.y) > 4) { this.ballVel.y *= -1; this.ball.position.y = Math.sign(this.ball.position.y) * 4; }
          this.leftPaddle.position.y = THREE.MathUtils.lerp(this.leftPaddle.position.y, this.ball.position.y, 0.1);
          this.rightPaddle.position.y = THREE.MathUtils.lerp(this.rightPaddle.position.y, this.ball.position.y, 0.1);
          this.ball.rotation.z += dt * 5;
        } else if (this.type === 'orbit') {
          this.orbits.children.forEach((orbit) => {
            const rat = orbit.children[0];
            const angle = this.time * rat.userData.speed + rat.userData.offset;
            rat.position.x = Math.cos(angle) * 5;
            rat.position.z = Math.sin(angle) * 5;
            rat.rotation.y = -angle + Math.PI/2;
          });
        } else if (this.type === 'king') {
          this.kingChain.forEach((rat, i) => {
            const angle = this.time * 2 - i * 0.4;
            rat.position.x = Math.cos(angle) * 4;
            rat.position.y = Math.sin(angle * 0.5) * 2;
            rat.position.z = Math.sin(angle) * 4;
            rat.rotation.y = -angle + Math.PI/2;
            rat.rotation.z = Math.sin(this.time * 5 + i) * 0.2;
          });
        } else if (this.type === 'raycast') {
          if (this.stalker) {
            this.stalker.position.z = Math.sin(this.time * 0.5) * 5;
            this.stalker.position.x = Math.cos(this.time * 0.3) * 3;
            this.stalker.rotation.y += dt;
          }
        } else if (this.type === 'boxing') {
          if (this.opponent) {
            this.opponent.position.z = Math.sin(this.time * 4) * 0.5;
            this.opponent.rotation.y = Math.sin(this.time * 2) * 0.2;
            this.leftHand.position.z = 4 + Math.sin(this.time * 8) * 1.5;
            this.rightHand.position.z = 4 + Math.sin(this.time * 8 + Math.PI) * 1.5;
          }
        }
      }

      animate() {
        if (!this.active) return;
        requestAnimationFrame(() => this.animate());
        this.update(this.clock.getDelta());
        this.renderer.render(this.scene, this.camera);
      }

      resize() {
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      destroy() {
        this.active = false;
        this.renderer.dispose();
        if (this.container.contains(this.renderer.domElement)) this.container.removeChild(this.renderer.domElement);
      }
    }

    const catalogData = [
	  { id: 'pong', title: 'Rat Pong', type: 'pong', url: 'rat-pong.html' },
      { id: 'orbit', title: 'Rat Orbit', type: 'orbit', url: 'rat-orbit.html' },
      { id: 'king', title: 'The Rat King', type: 'king', url: 'rat-king.html' },
      { id: 'raycast', title: 'Rat Raycast', type: 'raycast', url: 'rat-raycast.html' },
      { id: 'boxing', title: 'Rat Boxing', type: 'boxing', url: 'rat-boxing.html' }
    ];

    const catalogEl = document.getElementById('catalog');
    const expandedContainer = document.getElementById('expanded-container');
    const gameFrame = document.getElementById('game-frame');
    const backBtn = document.getElementById('back-btn');
    let activeVisualizers = [];

    function runIntro() {
      const header = document.getElementById('header');
      const catalog = document.getElementById('catalog');
      const footer = document.getElementById('footer');
      const items = document.querySelectorAll('.item');
      const letters = document.querySelectorAll('.rat-letter');
    
      letters.forEach((l) => {
        l.style.opacity = '0';
        l.style.transform = `
          translate3d(${(Math.random() - 0.5) * 500}px, ${(Math.random() - 0.5) * 500}px, 1000px) 
          rotateX(${Math.random() * 360}deg) 
          rotateY(${Math.random() * 360}deg)
        `;
      });
    
      setTimeout(() => {
        header.style.opacity = '1';
        letters.forEach((l, i) => {
          setTimeout(() => {
            l.style.transition = 'all 1.6s cubic-bezier(0.16, 1, 0.3, 1)';
            l.style.opacity = '1';
            l.style.transform = 'translate3d(0, 0, 0) rotateX(0) rotateY(0)';
          }, i * 100);
        });
      }, 200);
    
      setTimeout(() => {
        catalog.style.opacity = '1';
        footer.style.opacity = '1';
        items.forEach((item, i) => {
          setTimeout(() => {
            item.style.transition = 'all 1.2s cubic-bezier(0.16, 1, 0.3, 1)';
            item.style.opacity = '1';
            item.style.transform = 'translateY(0)';
          }, i * 150);
        });
      }, 800);
    }
    
    function initCatalog() {
      catalogData.forEach(data => {
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `<div class="item-canvas-container"></div><div class="item-info"><div class="item-title">${data.title}</div></div>`;
        catalogEl.appendChild(item);
        const container = item.querySelector('.item-canvas-container');
        activeVisualizers.push(new RatVisualizer(container, data.type));
        item.addEventListener('click', () => expandItem(data, item));
      });
      runIntro();
    }

    function expandItem(data, itemEl) {
      const rect = itemEl.getBoundingClientRect();
      const overlay = document.createElement('div');
      overlay.className = 'zoom-overlay';
      Object.assign(overlay.style, { top: rect.top + 'px', left: rect.left + 'px', width: rect.width + 'px', height: rect.height + 'px', borderRadius: '4px', opacity: '1' });
      document.body.appendChild(overlay);

      requestAnimationFrame(() => {
        overlay.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
        Object.assign(overlay.style, { top: '0', left: '0', width: '100vw', height: '100vh', borderRadius: '0' });
      });

      setTimeout(() => {
        document.body.classList.add('zoomed');
        expandedContainer.classList.add('active');
        gameFrame.src = data.url;
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 600);
      }, 600);
    }

    backBtn.addEventListener('click', () => {
      document.body.classList.remove('zoomed');
      expandedContainer.classList.remove('active');
      gameFrame.src = '';
    });

    window.addEventListener('resize', () => activeVisualizers.forEach(v => v.resize()));
    initCatalog();
  </script>
</body>
</html>
