<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rat King: The Chain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #010101; overflow: hidden; color: #eee; font-family: 'Averia Serif Libre', serif; }
    canvas { display: block; cursor: none; }
    #ui { 
      position: fixed; 
      bottom: 40px; 
      left: 40px; 
      letter-spacing: 0.4em; 
      text-transform: uppercase; 
      font-size: 12px; 
      pointer-events: none;
      opacity: 0.6;
    }
    #score { font-size: 24px; color: #fff; display: block; margin-top: 10px; }
    .hint { position: fixed; bottom: 40px; left: 40px; font-size: 10px; letter-spacing: 0.2em; color: #444; }
  </style>
</head>
<body>
  <div id="ui">
    <span id="score">1</span>
  </div>
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010101);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 25; // Pulled back slightly more

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 2.5);
    scene.add(ambient);

    // Physics constants
    const DAMPING = 0.92;
    const SPRING = 0.12;
    const CHAIN_DIST = 0.6;

    let ratModel, ratTex;
    const texLoader = new THREE.TextureLoader();
    const objLoader = new OBJLoader();
    
    const swarm = [];
    const crumbs = [];
    const mouse = new THREE.Vector2();
    const targetPos = new THREE.Vector3();

    // The Lead Rat (Head of the whip)
    const head = {
      pos: new THREE.Vector3(0, 0, 0),
      vel: new THREE.Vector3(0, 0, 0),
    };

    // Whip visual
    const whipLineGeom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
    const whipLineMat = new THREE.LineBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.5 });
    const whipLine = new THREE.Line(whipLineGeom, whipLineMat);
    scene.add(whipLine);

    texLoader.load('rattex.png', (tex) => {
      ratTex = tex;
      ratTex.magFilter = THREE.NearestFilter;
      ratTex.minFilter = THREE.NearestFilter;
      objLoader.load('model_0.obj', (obj) => {
        obj.traverse(c => { 
          if(c.isMesh) {
            c.material = new THREE.MeshStandardMaterial({map: ratTex, roughness: 0.8, metalness: 0.2});
            // Normalize scale
            c.geometry.computeBoundingBox();
            c.geometry.center();
            const box = new THREE.Box3().setFromObject(c);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            c.scale.set(1/maxDim, 1/maxDim, 1/maxDim);
          }
        });
        ratModel = obj;
        addRatToChain();
      });
    });

    function addRatToChain() {
      const g = ratModel.clone();
      const s = 1.0; // Normalized model means we can use absolute units
      g.scale.set(s, s, s);
      scene.add(g);
      
      const prevPos = swarm.length > 0 ? swarm[swarm.length-1].pos.clone() : new THREE.Vector3();
      swarm.push({ 
        mesh: g, 
        pos: prevPos,
        lastPos: prevPos.clone(),
        offset: Math.random() * Math.PI * 2
      });
      document.getElementById('score').innerText = swarm.length;
    }

    function spawnCrumb() {
      const geom = new THREE.BoxGeometry(0.3, 0.3, 0.3);
      const mat = new THREE.MeshStandardMaterial({ 
        color: 0xffffff, 
        emissive: 0xffffff, 
        emissiveIntensity: 0.5 
      });
      const mesh = new THREE.Mesh(geom, mat);
      
      const aspect = window.innerWidth / window.innerHeight;
      mesh.position.set(
        (Math.random() - 0.5) * 40 * aspect,
        (Math.random() - 0.5) * 40,
        0
      );
      scene.add(mesh);
      crumbs.push(mesh);
    }

    for(let i=0; i<8; i++) spawnCrumb();

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      
      const vector = new THREE.Vector3(mouse.x, mouse.y, 0.5);
      vector.unproject(camera);
      const dir = vector.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      targetPos.copy(camera.position).add(dir.multiplyScalar(distance));
    });

    function animate() {
      requestAnimationFrame(animate);
      if (!ratModel) return;

      const time = Date.now() * 0.001;

      // 1. Update Head (Whip Physics)
      const force = new THREE.Vector3().subVectors(targetPos, head.pos).multiplyScalar(SPRING);
      head.vel.add(force);
      head.vel.multiplyScalar(DAMPING);
      head.pos.add(head.vel);

      // Update whip visual
      whipLine.geometry.setFromPoints([targetPos, head.pos]);
      whipLine.geometry.attributes.position.needsUpdate = true;

      // 2. Update Chain (Follower Physics)
      swarm.forEach((rat, i) => {
        const leaderPos = (i === 0) ? head.pos : swarm[i - 1].pos;
        
        const diff = new THREE.Vector3().subVectors(rat.pos, leaderPos);
        const dist = diff.length();
        
        if (dist > CHAIN_DIST) {
          diff.normalize().multiplyScalar(CHAIN_DIST);
          rat.pos.copy(leaderPos).add(diff);
        }

        const dir = new THREE.Vector3().subVectors(leaderPos, rat.pos);
        if (dir.length() > 0.01) {
          const targetAngle = Math.atan2(dir.y, dir.x) + Math.PI/2;
          rat.mesh.rotation.z = THREE.MathUtils.lerp(rat.mesh.rotation.z, targetAngle, 0.2);
        }

        const wiggle = Math.sin(time * 10 + i * 0.5) * 0.15;
        rat.mesh.position.x = rat.pos.x + Math.cos(rat.mesh.rotation.z) * wiggle;
        rat.mesh.position.y = rat.pos.y + Math.sin(rat.mesh.rotation.z) * wiggle;
        rat.mesh.position.z = Math.sin(time * 4 + i) * 0.2;
        
        const bounce = Math.abs(Math.sin(time * 15 + i * 0.3)) * 0.1;
        rat.mesh.scale.setScalar(0.8 + bounce);
      });

      // 3. Collision with Crumbs
      crumbs.forEach((c, i) => {
        c.rotation.y += 0.05;
        c.rotation.z += 0.02;
        
        let eaten = false;
        swarm.forEach(rat => {
          if (rat.pos.distanceTo(c.position) < 1.0) eaten = true;
        });

        if (eaten) {
          scene.remove(c);
          crumbs.splice(i, 1);
          addRatToChain();
          spawnCrumb();
        }
      });

      renderer.render(scene, camera);
    }
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
